  <script>
    /* Runs before first paint so someone who switched motion off never sees
       a frame of it switched back on. src/experience/motion.js owns this
       value from here; the two agree on the rule. */
    try {
      var stored = sessionStorage.getItem('motion');
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.documentElement.dataset.motion = (!reduce && stored !== 'off') ? 'on' : 'off';
    } catch (e) {
      document.documentElement.dataset.motion = 'on';
    }
  </script>
